[package]
name = "petty-shogi"
version = "0.1.0"
edition = "2024"

license = "MIT OR Apache-2.0"
repository = "https://github.com/Icerath/petty-shogi"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
manual_checked_ops = "allow"

[dependencies]
atoi = "2.0.0"
clap = { version = "4.6.1", features = ["derive"] }
konst = "0.4.3"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.149"

[features]
serde = ["dep:serde"]

[profile.dev]
opt-level = 3

[profile.release]
lto = "fat"
